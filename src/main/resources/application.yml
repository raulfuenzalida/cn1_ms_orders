server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: ms-orders
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/orders_db
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  sql:
    init:
      mode: always
      schema-locations: classpath:database/init.sql
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:https://login.microsoftonline.com/14c46308-ab91-4693-b0c0-daddd7a8aab5/v2.0}
          audiences:
            - ${OAUTH2_AUDIENCE:api://80bf85e9-a444-4754-b780-c65dfff74876}
            - ${OAUTH2_AUDIENCE_ID:80bf85e9-a444-4754-b780-c65dfff74876}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3

ms:
  products:
    base-url: ${MS_PRODUCTS_BASE_URL:http://localhost:8081}

aws:
  region: ${AWS_REGION:us-east-1}

app:
  security:
    jwt:
      # Entra ID (front_admin) - valida tokens del admin
      entra-issuer-uri: ${OAUTH2_ISSUER_URI:https://login.microsoftonline.com/14c46308-ab91-4693-b0c0-daddd7a8aab5/v2.0}
      entra-jwk-set-uri: ${OAUTH2_JWK_SET_URI:https://login.microsoftonline.com/14c46308-ab91-4693-b0c0-daddd7a8aab5/discovery/v2.0/keys}
      # AWS Cognito (front_public clientes) - valida tokens de clientes
      cognito-issuer-uri: ${COGNITO_ISSUER_URI:https://cognito-idp.${AWS_REGION:us-east-1}.amazonaws.com/${COGNITO_USER_POOL_ID:us-east-1_KtdUxURf6}}
      cognito-jwk-set-uri: ${COGNITO_JWK_SET_URI:https://cognito-idp.${AWS_REGION:us-east-1}.amazonaws.com/${COGNITO_USER_POOL_ID:us-east-1_KtdUxURf6}/.well-known/jwks.json}

kafka:
  topic:
    filament-consumption: ${KAFKA_TOPIC_FILAMENT_CONSUMPTION:printworks.filament-consumption}

rabbitmq:
  exchange:
    events: printworks.events
  routing-key:
    order-created: order.created

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://raulfuenzalida.github.io}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    duoc.cn1.ms_orders: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
