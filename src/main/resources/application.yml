server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: ms-orders
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/orders_db
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  sql:
    init:
      mode: always
      schema-locations: classpath:database/init.sql
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/14c46308-ab91-4693-b0c0-daddd7a8aab5/v2.0
          audiences:
            - api://80bf85e9-a444-4754-b780-c65dfff74876
            - 80bf85e9-a444-4754-b780-c65dfff74876

ms:
  products:
    base-url: ${MS_PRODUCTS_BASE_URL:http://localhost:8081}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://raulfuenzalida.github.io}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    duoc.cn1.ms_orders: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
