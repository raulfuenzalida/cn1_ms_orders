server:
  port: 8082

spring:
  application:
    name: ms-orders-test
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  h2:
    console:
      enabled: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

rabbitmq:
  exchange:
    events: printworks.events
  routing-key:
    order-created: order.created

logging:
  level:
    duoc.cn1.ms_orders: DEBUG
    org.springframework.security: DEBUG
